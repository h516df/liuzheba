name: Deliver locally signed release
on:
  push:
    branches: [release/delivery-v0.15-20261020]
permissions: {}
jobs:
  publish:
    if: github.repository == 'h516df/liuzheba' && github.ref == 'refs/heads/release/delivery-v0.15-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Fetch exact unsigned base from the same source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39372508169 --repo h516df/liuzheba --name unsigned-release-77ebbfc8a4a0fcc0212b95bfaab850c83daae9f1 --dir .release-delivery/base
      - name: Restore the already signed bytes, verify, publish and anonymously read back
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python3 .release-delivery/verify_and_publish.py
      - name: Preserve publication audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-release-v0.15-audit-${{ github.sha }}
          path: .release-delivery/state/cloud-audit.json
          if-no-files-found: ignore
          retention-days: 14
