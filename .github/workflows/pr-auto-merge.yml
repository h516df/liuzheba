# Privileged metadata-only watcher. NEVER checkout or execute untrusted PR code.
name: Opt-in PR auto-merge
on:
  workflow_run:
    workflows:
      - Cloud development
      - Android checks
      - Android device checks
      - Secret checks
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  checks: read
concurrency:
  group: opt-in-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  finish:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0; trusted default branch only
        with:
          persist-credentials: false
          ref: main
      - name: Check current PR and merge exact green head only if opted in
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 cloud/auto_merge_green.py
