name: Android device checks

on:
  pull_request:
    paths:
      - 'app/**'
      # PR-only: host tests and isolated social extractors do not touch these
      # native media/backup flows. Main pushes still exercise every device test.
      - '!app/src/test/**'
      - '!app/src/main/python/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'tools/verification.init.gradle'
      - 'cloud/device_acceptance.sh'
      - 'cloud/isolated_build.py'
      - 'cloud/test_isolated_build.py'
      - 'cloud/prepare_upgrade_reference.py'
      - 'cloud/run_official_upgrade.py'
      - 'cloud/verify_upgrade.py'
      - 'tools/release/verify_apk.py'
      - '.github/workflows/android-device-checks.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_reference_run:
        description: Optional prior main production-release run for upgrade harness validation
        type: string
        default: ''
      signed_reference_sha:
        description: Exact source SHA of that already signed reference candidate
        type: string
        default: ''

concurrency:
  group: android-device-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  device:
    name: API 35 isolated device acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Start isolated build alongside emulator cold boot
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          chmod +x gradlew
          python3 cloud/isolated_build.py start
      - name: Validate optional signed reference origin
        if: inputs.signed_reference_run != '' || inputs.signed_reference_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_RUN: ${{ inputs.signed_reference_run }}
          REFERENCE_SHA: ${{ inputs.signed_reference_sha }}
        run: python3 cloud/prepare_upgrade_reference.py
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: inputs.signed_reference_run != ''
        with:
          name: signed-candidate-${{ inputs.signed_reference_sha }}
          run-id: ${{ inputs.signed_reference_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reference
      - name: Verify reference APK and published baseline
        if: inputs.signed_reference_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.16 --repo h516df/liuzheba --pattern shicang-v0.16-universal.apk --dir "$RUNNER_TEMP/reference"
          python3 -c 'import hashlib,json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"],"reference","shicang-v0.16-universal.apk"); assert hashlib.sha256(p.read_bytes()).hexdigest()==json.load(open("release/signing-identity.json"))["publishedApkSha256"]'
          python3 tools/release/verify_apk.py --candidate "$RUNNER_TEMP/reference/official.apk" --previous "$RUNNER_TEMP/reference/shicang-v0.16-universal.apk" --receipt "$RUNNER_TEMP/reference/identity.json"
      # This permission is restricted to GitHub's disposable hosted VM, never a user's computer.
      - name: Enable KVM on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          id -nG
          ls -l /dev/kvm || true
          if [ ! -c /dev/kvm ]; then
            echo '::error::The disposable runner does not expose /dev/kvm; no device tests have run.'
            exit 1
          fi
          # A triggered udev event need not finish before the next shell command.
          # Only if needed, apply the same approved access to this ephemeral node.
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'KVM is accessible after udev settle; no direct permission change needed.'
          else
            echo 'KVM exists but is not accessible; applying the approved temporary node permissions.'
            sudo chmod 0666 /dev/kvm
          fi
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Exercise offline synthetic device flows
        env:
          REFERENCE_SHA: ${{ inputs.signed_reference_sha }}
        # Official v2.37.0, including Node 24 and build-tools 36 support.
        # https://github.com/ReactiveCircus/android-emulator-runner/releases/tag/v2.37.0
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # A 2 GiB / two-core API 35 Google APIs image showed repeatable
          # Pixel Launcher ANR overlays that obstructed unrelated UI tests.
          # Keep this same image/coverage but give system services headroom.
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 cloud/isolated_build.py wait && bash cloud/device_acceptance.sh
      - name: Show isolated build log on failure
        if: failure()
        run: tail -n 120 "$RUNNER_TEMP/shicang-isolated-build/build.log" || true
      - name: Preserve optional reference harness receipt
        if: success() && inputs.signed_reference_run != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upgrade-harness-${{ github.sha }}
          path: ${{ runner.temp }}/reference-upgrade/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve text-only test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-device-api35-${{ github.sha }}
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: warn
          retention-days: 7
