name: Android device checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'tools/verification.init.gradle'
      - '.github/workflows/android-device-checks.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-device-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  device:
    name: API 35 isolated device acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Build only the isolated debug application and tests
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 -I tools/verification.init.gradle assembleDebug assembleDebugAndroidTest
      - name: Verify the actual isolated APK before any device test
        run: python3 cloud/check_apk_identity.py app/build/outputs/apk/debug/app-debug.apk dev.h516.shicang.verification
      # This permission is restricted to GitHub's disposable hosted VM, never a user's computer.
      - name: Enable KVM on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          id -nG
          ls -l /dev/kvm || true
          if [ ! -c /dev/kvm ]; then
            echo '::error::The disposable runner does not expose /dev/kvm; no device tests have run.'
            exit 1
          fi
          # A triggered udev event need not finish before the next shell command.
          # Only if needed, apply the same approved access to this ephemeral node.
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'KVM is accessible after udev settle; no direct permission change needed.'
          else
            echo 'KVM exists but is not accessible; applying the approved temporary node permissions.'
            sudo chmod 0666 /dev/kvm
          fi
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Exercise offline synthetic device flows
        # Official v2.37.0, including Node 24 and build-tools 36 support.
        # https://github.com/ReactiveCircus/android-emulator-runner/releases/tag/v2.37.0
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell wm size 720x1280
            adb shell wm density 240
            status=0; ./gradlew --no-daemon --max-workers=1 -I tools/verification.init.gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.h516.shicang.DeviceAcceptanceTest || status=$?; adb shell run-as dev.h516.shicang.verification cat files/device-acceptance-media3.txt || true; exit "$status"
      - name: Preserve text-only test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-device-api35-${{ github.sha }}
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: warn
          retention-days: 7
