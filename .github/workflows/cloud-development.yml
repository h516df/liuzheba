name: Cloud development
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      # Keep the required "check" job, but avoid Android setup for an isolated
      # Python PR-maintenance edit. Unknown or uninspectable changes build fully.
      # Every main push still produces the APKs required by the official release gate.
      - name: Detect isolated PR maintenance changes
        id: scope
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && !startsWith(github.head_ref, 'release/') && !startsWith(github.head_ref, 'codex/release/') }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          allowed = {'cloud/finish_green_pr.py', 'cloud/test_finish_green_pr.py'}
          changed = set()
          try:
              parents = subprocess.check_output(
                  ['git', 'rev-list', '--parents', '-n', '1', 'HEAD'], text=True
              ).split()
              if len(parents) == 3:
                  raw = subprocess.check_output(
                      ['git', 'diff', '--name-only', '--no-renames', '-z', 'HEAD^1', 'HEAD']
                  )
                  changed = set(filter(None, raw.decode('utf-8', 'surrogateescape').split('\0')))
          except (OSError, subprocess.CalledProcessError, UnicodeError):
              pass
          tool_only = bool(changed) and changed <= allowed
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"tool_only={'true' if tool_only else 'false'}\n")
          print(f'Isolated maintenance PR: {tool_only}; changed files: {len(changed)}')
          PY
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.scope.outputs.tool_only != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        if: steps.scope.outputs.tool_only != 'true'
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Signing rejection policy (no credentials)
        run: python3 -m unittest discover -s cloud -p 'test_*.py' -v
      - name: Offline social media extraction checks
        if: steps.scope.outputs.tool_only != 'true'
        run: |
          python3 -m pip install --disable-pip-version-check 'yt-dlp==2026.8.19'
          python3 tools/tests/test_media_bridge.py
      - name: Prepare cloud toolchain
        if: steps.scope.outputs.tool_only != 'true'
        run: bash .devcontainer/setup.sh
      - name: Check this revision
        if: steps.scope.outputs.tool_only != 'true'
        run: bash cloud/check.sh
      - name: Preserve development APK and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-${{ github.sha }}
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/androidTest/debug/*.apk
            **/build/test-results/**/*.xml
            **/build/reports/lint-results-debug.*
          retention-days: 3
          if-no-files-found: ignore
